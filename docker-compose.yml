version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: ./services/airflow
    dockerfile: Dockerfile
  image: custom-airflow:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: "jJxlkZKtg-k7q69VeqMel9yFAN-IWkOVAkue-hLiLDA="
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # DATABASE
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow

    # LOGGING FIX
    AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__HOSTNAME_CALLABLE: "airflow.utils.net.get_hostname"

    # TIMEZONE
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Europe/Paris

    AIRFLOW_UID: 50000

    # DSP ENV
    TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
    API_INTERNAL_URL: http://api:8000
    APP_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/predictions

    # GREAT EXPECTATIONS FIX
    GE_DISABLE_TQDM: "true"
    GE_PROGRESS_BAR: "false"

  volumes:
    - ./services/airflow/dags:/opt/airflow/dags
    - ./services/airflow/logs:/opt/airflow/logs
    - ./services/airflow/plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./gx:/opt/airflow/gx
  user: "50000:0"
  networks:
    - airflow-net
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy


services:

  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow
    volumes:
      - ./postgres_data:/var/lib/postgresql/data     # <<< FIXED persistent DB
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  api:
    build: ./services/api
    container_name: fastapi
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/predictions
    volumes:
      - ./services/api:/app
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./dataset:/app/dataset
      - ./data/reports:/app/reports
    ports:
      - "8000:8000"
    networks:
      - airflow-net
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    build: ./services/webapp
    container_name: webapp
    environment:
      API_URL: http://api:8000
    volumes:
      - ./services/webapp:/app
    ports:
      - "8501:8501"
    networks:
      - airflow-net
    depends_on:
      - api

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --role Admin \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: bash -c "airflow scheduler"
    restart: always
    depends_on:
      - airflow-init
    networks:
      - airflow-net

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: bash -c "airflow webserver"
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - airflow-init
      - airflow-scheduler
    networks:
      - airflow-net

  grafana:
    build:
      context: ./services/grafana
      dockerfile: Dockerfile
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_DOMAIN: localhost
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./services/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./services/grafana/dashboards_editable:/var/lib/grafana/dashboards
    depends_on:
      - postgres
    networks:
      - airflow-net


volumes:
  grafana_data:

networks:
  airflow-net:
    driver: bridge